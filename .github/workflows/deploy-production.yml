name: Deploy production clients

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      migrations_changed: ${{ steps.migrations.outputs.migrations_changed }}
      tenant_migrations: ${{ steps.tenant-migrations.outputs.tenant_migrations }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed source migrations
        id: migrations
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            printf 'migrations_changed=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before_sha="${{ github.event.before }}"
          after_sha="$GITHUB_SHA"
          zero_sha="0000000000000000000000000000000000000000"

          if [ -z "$before_sha" ] || [ "$before_sha" = "$zero_sha" ]; then
            if ! before_sha="$(git rev-parse "$after_sha^" 2>/dev/null)"; then
              echo "::error::Cannot determine a reliable commit range for migration detection."
              exit 1
            fi
          fi

          if ! git cat-file -e "$before_sha^{commit}" 2>/dev/null || ! git cat-file -e "$after_sha^{commit}" 2>/dev/null; then
            echo "::error::Cannot determine a reliable commit range for migration detection."
            exit 1
          fi

          if ! changed_files="$(git diff --name-only "$before_sha" "$after_sha" -- supabase/migrations)"; then
            echo "::error::Cannot determine a reliable commit range for migration detection."
            exit 1
          fi

          if [ -n "$changed_files" ]; then
            printf 'migrations_changed=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'migrations_changed=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate production deployment config
        run: npm run validate:deploy:cf

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest
        run: npm test

      - name: Build Tenant migration manifest
        id: tenant-migrations
        shell: bash
        run: |
          tenant_migrations="$(node scripts/production-deploy-config.mjs tenant-migrations | node -e 'let input = ""; process.stdin.on("data", (chunk) => { input += chunk; }); process.stdin.on("end", () => { process.stdout.write(JSON.stringify(input.trim().split("\\n").filter(Boolean))); });')"
          printf 'tenant_migrations=%s\n' "$tenant_migrations" >> "$GITHUB_OUTPUT"

      - name: Build deployment matrix
        id: matrix
        shell: bash
        run: |
          matrix="$(node scripts/production-deploy-config.mjs matrix)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  migrate:
    name: Migrate ${{ matrix.target }}
    needs: verify
    if: ${{ github.event_name == 'push' && needs.verify.outputs.migrations_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    environment:
      name: ${{ matrix.target }}
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0

      - name: Stage Tenant-owned migrations
        id: stage-migrations
        shell: bash
        env:
          MIGRATION_FILENAMES_JSON: ${{ needs.verify.outputs.tenant_migrations }}
        run: |
          tenant_migrations_dir="$(mktemp -d "$RUNNER_TEMP/bpv-tenant-migrations.XXXXXX")"
          mkdir -p "$tenant_migrations_dir/supabase/migrations"
          tenant_migrations="$(printf '%s' "$MIGRATION_FILENAMES_JSON" | jq -r '.[]')"

          while IFS= read -r filename; do
            if [[ ! "$filename" =~ ^[0-9]{14}_.+\.sql$ ]] || [[ ! -f "supabase/migrations/$filename" ]]; then
              echo "::error::Invalid Tenant migration filename: $filename"
              exit 1
            fi

            cp -- "supabase/migrations/$filename" "$tenant_migrations_dir/supabase/migrations/$filename"
          done <<< "$tenant_migrations"

          printf 'path=%s\n' "$tenant_migrations_dir" >> "$GITHUB_OUTPUT"

      - name: Link and apply Tenant migrations
        id: migrate
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BPV_SUPABASE_PROJECT_REF: ${{ matrix.projectRef }}
        run: |
          pushd "${{ steps.stage-migrations.outputs.path }}"
          supabase link --project-ref "$BPV_SUPABASE_PROJECT_REF"
          supabase db push --linked --include-all
          popd

      - name: Write migration summary
        if: ${{ always() }}
        shell: bash
        env:
          MIGRATION_OUTCOME: ${{ steps.migrate.outcome }}
        run: |
          {
            echo "### Supabase migration: \`${{ matrix.target }}\`"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Project ref: \`${{ matrix.projectRef }}\`"
            echo "- Result: ${MIGRATION_OUTCOME:-not-run}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy ${{ matrix.target }}
    needs:
      - verify
      - migrate
    if: ${{ !cancelled() && always() && needs.verify.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    environment:
      name: ${{ matrix.target }}
      url: ${{ matrix.siteUrl }}
    env:
      BPV_DEPLOY_TARGET: ${{ matrix.target }}
      BPV_DEPLOY_SITE_URL: ${{ matrix.siteUrl }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare API token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          token_verification_response="$(curl --fail --silent --show-error --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          printf '%s' "$token_verification_response" | node -e 'let body = ""; process.stdin.on("data", (chunk) => { body += chunk; }); process.stdin.on("end", () => { try { process.exit(JSON.parse(body).success === true ? 0 : 1); } catch { process.exit(1); } });'

      - name: Validate target configuration
        id: validate
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_SITE_URL: ${{ matrix.siteUrl }}
          NEXT_PUBLIC_HOME_CONFIG_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_HOME_CONFIG_SUPABASE_URL }}
          NEXT_PUBLIC_HOME_CONFIG_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_HOME_CONFIG_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run validate:deploy:cf -- "$BPV_DEPLOY_TARGET"

      - name: Build OpenNext
        id: build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ matrix.siteUrl }}
          NEXT_PUBLIC_HOME_CONFIG_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_HOME_CONFIG_SUPABASE_URL }}
          NEXT_PUBLIC_HOME_CONFIG_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_HOME_CONFIG_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:cf

      - name: Deploy Worker
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            npm run deploy:cf:built -- --env "$BPV_DEPLOY_TARGET" --dry-run
          else
            npm run deploy:cf:built -- --env "$BPV_DEPLOY_TARGET"
          fi

      - name: Write deployment summary
        if: ${{ always() }}
        shell: bash
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          {
            echo "### Production deployment: \`$BPV_DEPLOY_TARGET\`"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- URL: $BPV_DEPLOY_SITE_URL"
            echo "- Validate: ${VALIDATE_OUTCOME:-not-run}"
            echo "- Build: ${BUILD_OUTCOME:-not-run}"
            echo "- Deploy: ${DEPLOY_OUTCOME:-not-run}"
          } >> "$GITHUB_STEP_SUMMARY"
